[project]
name = "aspire-mcp-demo"
version = "0.1.0"
description = "MCP server exposing invoices (SQLite) and hybrid RAG search over accounting notes to Claude Desktop, with a retrieval eval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "mcp[cli]>=2,<3",
    "numpy>=2.5.5",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
aspire-mcp-demo = "aspire_mcp_demo:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
